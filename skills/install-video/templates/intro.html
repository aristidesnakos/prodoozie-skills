<!doctype html><!-- size 1920x1080. Fields: kicker, title (a new line is a line break), sub, subAccent (the one amber phrase) -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:{{ground}}}
</style></head><body>
<div style="position:absolute;left:150px;top:350px">
 <div style="font:500 26px 'JetBrains Mono';letter-spacing:.28em;color:#9C9289;text-transform:uppercase">{{kicker}}</div>
 <div style="font:900 104px/1.02 Jost;color:#F2ECE4;text-transform:uppercase;letter-spacing:-0.012em;margin-top:28px">{{title}}</div>
 <div style="font:400 38px Inter;color:#CFC6BC;margin-top:34px">{{sub}} <span style="color:#E8A317">{{subAccent}}</span></div>
</div></body></html>
