<!doctype html><!-- size 1280x720. The YouTube thumbnail. Fields: kicker, title (new lines break), command -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>
html,body{margin:0;width:1280px;height:720px;background:{{ground}};overflow:hidden}
</style></head><body>
<div style="position:absolute;left:84px;top:150px">
 <div style="font:500 22px 'JetBrains Mono';letter-spacing:.28em;color:#9C9289;text-transform:uppercase">{{kicker}}</div>
 <div style="font:900 96px/1 Jost;color:#F2ECE4;text-transform:uppercase;letter-spacing:-0.012em;margin-top:22px">{{title}}</div>
</div>
<div style="position:absolute;left:84px;bottom:70px;font:500 24px 'JetBrains Mono';color:#CFC6BC"><span style="color:#E8A317">$</span> {{command}}</div>
<svg style="position:absolute;right:110px;top:250px" width="220" height="220" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#E8A317"/><ellipse cx="60" cy="60" rx="10" ry="40" fill="{{ground}}"/></svg>
</body></html>
