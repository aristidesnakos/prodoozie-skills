<!doctype html><!-- size 1920x1080. Fields: line, name, url. The mark is the leopard's eye: an amber disc and a dark slit. -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:{{ground}}}
</style></head><body>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
 <svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#E8A317"/><ellipse cx="60" cy="60" rx="10" ry="40" fill="{{ground}}"/></svg>
 <div style="font:500 40px Inter;color:#CFC6BC;margin-top:44px">{{line}}</div>
 <div style="font:900 120px/1 Jost;color:#F2ECE4;text-transform:uppercase;letter-spacing:-0.012em;margin-top:12px">{{name}}</div>
 <div style="font:500 36px 'JetBrains Mono';color:#E8A317;margin-top:40px">{{url}}</div>
</div></body></html>
